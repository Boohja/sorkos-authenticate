<include href="_layout_start.html" />
<section class="info-page">
    <aside class="info-visual" aria-hidden="true">
        <img src="/img/door.webp" alt="">
    </aside>
    <div class="info-copy">
        <h1>{{ @about.title }}</h1>
        <p>{{ @about.intro | raw }}</p>

        <div class="plain-sections">
            <section>
                <h2>{{ @about.streamlined_title }}</h2>
                <p>{{ @about.streamlined_text }}</p>
            </section>
            <section>
                <h2>{{ @about.developer_title }}</h2>
                <p>{{ @about.developer_text }}</p>
            </section>
            <section>
                <h2>{{ @about.minimal_title }}</h2>
                <p>{{ @about.minimal_text }} <a href="{{ @privacy_url }}">{{ @about.minimal_link }}</a></p>
            </section>
        </div>

        <check if="{{ @return_to }}">
            <a class="button info-return" href="{{ @return_to }}">{{ @action.back_to_login }}</a>
        </check>
    </div>
</section>
<include href="_layout_end.html" />
