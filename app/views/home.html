<include href="_layout_start.html" />
<section class="landing-message">
    <h1>Central login for Sorkos projects</h1>
    <check if="{{ @current_user }}">
        <div class="landing-session-hint">
            <span>Logged in as <strong>{{ @current_user_label }}</strong></span>
            <div class="landing-session-actions">
                <a href="/account" data-transition-to-standard>Manage</a>
                <form method="post" action="/logout">
                    <button class="button landing-logout" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </check>
</section>
<include href="_layout_end.html" />
