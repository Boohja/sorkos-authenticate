<include href="_layout_start.html" />
<section class="panel">
    <h1>Admin Login</h1>
    <check if="{{ @invalid_login }}">
        <p class="notice error">Invalid data.</p>
    </check>
    <form class="form-stack" method="post" action="/admin/login" data-admin-login-form>
        <label for="username" data-admin-login-credentials>Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required data-admin-login-credentials>

        <label for="password" data-admin-login-credentials>Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required data-admin-login-credentials>

        <label for="otp" data-admin-login-otp>One-time password</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required data-admin-login-otp>

        <button class="button primary" type="submit" data-admin-login-submit data-continue-label="Continue" data-submit-label="Sign In">Sign In</button>
    </form>
</section>
<include href="_layout_end.html" />
